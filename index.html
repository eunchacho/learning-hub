<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Learning Camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: two stacked bands (global header · page bar), then the page. Catalog = filter rail + card grid; course = unit list + unit body.
   Two skins share one component set: "work" reads as a corporate learning portal (fixed light), "focus" is a quiet study surface (light/dark). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eceeea; --line:#d8ddd6; --text:#1c211f; --muted:#5b6560;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --ok:#1e7a46; --ok-soft:#e3f3e8; --bad:#b42318; --bad-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fbf0d4;
  --band1:#1d2b27; --band1-text:#f2f5f3; --band1-muted:#a9b8b1; --band1-hover:rgba(255,255,255,.08);
  --band2:#26483e; --band2-text:#ffffff; --strip:#1d2b27; --band1-line:transparent;
  --side:#ffffff; --side-text:#1c211f; --side-muted:#5b6560; --side-head:#e7ebe6; --side-line:#d8ddd6; --side-on:#1f6f5c; --side-on-ink:#ffffff;
  --notice:#fbf0d4; --notice-text:#4d3400; --notice-line:#ead08c;
  --thumb-a:#1c382f; --thumb-b:#2c6353; --thumb-ink:#cfeadf; --thumb-line:rgba(255,255,255,.10);
  --pill-course:#1f6f5c; --pill-curr:#6b3fa0; --pill-ink:#ffffff;
  --tile-1:#3b5560; --tile-2:#a9521f; --tile-ink:#ffffff;
  --hero-bg:linear-gradient(120deg,#1c382f 0%,#2c6353 100%); --hero-text:#ffffff; --hero-muted:#cfe3da; --hero-line:rgba(255,255,255,.22);
  --pre:#2b59c3; --pre-soft:#e5ecfa; --root:#9a5a06; --root-soft:#f8ecd9; --suf:#1e7a46; --suf-soft:#e3f3e8;
  --shadow:0 1px 2px rgba(16,24,20,.07); --radius:8px; --radius-sm:4px;
  --font-ui:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-read:var(--font-ui);
  --fs:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#19201d; --surface-2:#222a26; --line:#303a35; --text:#e4e9e6; --muted:#9aa7a0;
    --accent:#62c6a8; --accent-ink:#0c1a15; --accent-soft:#183a30;
    --ok:#54c78d; --ok-soft:#13301f; --bad:#f2806f; --bad-soft:#3a1c18; --warn:#e2b552; --warn-soft:#382d12;
    --band1:#0b100e; --band1-text:#e4e9e6; --band1-muted:#8fa39a; --band1-hover:rgba(255,255,255,.06);
    --band2:#15241f; --band2-text:#e4e9e6; --strip:#0b100e;
    --side:#19201d; --side-text:#e4e9e6; --side-muted:#9aa7a0; --side-head:#222a26; --side-line:#303a35; --side-on:#62c6a8; --side-on-ink:#0c1a15;
    --notice:#382d12; --notice-text:#f0d58f; --notice-line:#5a4a1e;
    --thumb-a:#12241e; --thumb-b:#21463a; --thumb-ink:#bfe3d4; --thumb-line:rgba(255,255,255,.08);
    --pill-course:#2f8a72; --pill-curr:#7f55b5; --pill-ink:#ffffff;
    --tile-1:#2a3c44; --tile-2:#7f3d16; --tile-ink:#f2f5f3;
    --hero-bg:linear-gradient(120deg,#12241e 0%,#21463a 100%); --hero-text:#f2f5f3; --hero-muted:#b6cfc4; --hero-line:rgba(255,255,255,.16);
    --pre:#93b1ff; --pre-soft:#1c2948; --root:#f0b45f; --root-soft:#3a2a13; --suf:#54c78d; --suf-soft:#13301f;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201d; --surface-2:#222a26; --line:#303a35; --text:#e4e9e6; --muted:#9aa7a0;
  --accent:#62c6a8; --accent-ink:#0c1a15; --accent-soft:#183a30;
  --ok:#54c78d; --ok-soft:#13301f; --bad:#f2806f; --bad-soft:#3a1c18; --warn:#e2b552; --warn-soft:#382d12;
  --band1:#0b100e; --band1-text:#e4e9e6; --band1-muted:#8fa39a; --band1-hover:rgba(255,255,255,.06);
  --band2:#15241f; --band2-text:#e4e9e6; --strip:#0b100e;
  --side:#19201d; --side-text:#e4e9e6; --side-muted:#9aa7a0; --side-head:#222a26; --side-line:#303a35; --side-on:#62c6a8; --side-on-ink:#0c1a15;
  --notice:#382d12; --notice-text:#f0d58f; --notice-line:#5a4a1e;
  --thumb-a:#12241e; --thumb-b:#21463a; --thumb-ink:#bfe3d4; --thumb-line:rgba(255,255,255,.08);
  --pill-course:#2f8a72; --pill-curr:#7f55b5; --pill-ink:#ffffff;
  --tile-1:#2a3c44; --tile-2:#7f3d16; --tile-ink:#f2f5f3;
  --hero-bg:linear-gradient(120deg,#12241e 0%,#21463a 100%); --hero-text:#f2f5f3; --hero-muted:#b6cfc4; --hero-line:rgba(255,255,255,.16);
  --pre:#93b1ff; --pre-soft:#1c2948; --root:#f0b45f; --root-soft:#3a2a13; --suf:#54c78d; --suf-soft:#13301f;
  --shadow:none;
  color-scheme:dark;
}
/* Work skin: one fixed light look (navy global bar, blue page bar and filter rail), declared last so it wins over the dark blocks. */
:root[data-skin="work"]{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f3f4f6; --line:#dcdfe4; --text:#1b1d21; --muted:#5c6370;
  --accent:#1a62a8; --accent-ink:#ffffff; --accent-soft:#e7f0fa;
  --ok:#2e844a; --ok-soft:#ebf7e6; --bad:#b3091a; --bad-soft:#fdeeec; --warn:#7a4300; --warn-soft:#fef1d9;
  --band1:#194877; --band1-text:#ffffff; --band1-muted:#c6d6ea; --band1-hover:rgba(255,255,255,.10); --band1-line:#d4d4d4;
  --band2:#005fb2; --band2-text:#ffffff; --strip:#164a85;
  --side:#005fb2; --side-text:#ffffff; --side-muted:#cfe2f6; --side-head:#004f95; --side-line:rgba(255,255,255,.14); --side-on:#0c3d76; --side-on-ink:#ffffff;
  --notice:#f9c418; --notice-text:#2a2100; --notice-line:#e1ad00;
  --thumb-a:#06264d; --thumb-b:#0b3c74; --thumb-ink:#5db7ef; --thumb-line:rgba(255,255,255,.07);
  --pill-course:#115dad; --pill-curr:#6f1e9a; --pill-ink:#ffffff;
  --tile-1:#3e5674; --tile-2:#e06e2b; --tile-ink:#ffffff;
  --hero-bg:linear-gradient(120deg,#0b3c74 0%,#115dad 100%); --hero-text:#ffffff; --hero-muted:#d2e2f5; --hero-line:rgba(255,255,255,.24);
  --pre:#1a62a8; --pre-soft:#e7f0fa; --root:#8c4b02; --root-soft:#fef1d9; --suf:#2e844a; --suf-soft:#ebf7e6;
  --shadow:0 1px 3px rgba(20,35,60,.10); --radius:4px; --radius-sm:4px;
  --phead:#2c62a8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
/* Type: Korean reads best with words kept whole and a slightly tighter track; one size scale (.75 · .875 · 1 · 1.15 · 1.3 · 1.9 · 2.3rem). */
body{font-family:var(--font-ui);font-size:var(--fs);line-height:1.6;letter-spacing:0;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.small{line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band1)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== global header (band 1) ===== */
.gh{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band1);color:var(--band1-text);border-bottom:1px solid var(--band1-line,transparent)}
.gh .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--band1-text);flex:none}
/* Wordmark only: Lato, the closest free face to the reference portal type. Everything else stays in the one UI family. */
.brand svg{width:48px;height:48px;flex:none}
.brand .bt{display:grid;line-height:1.25;font-family:"Lato",var(--font-ui);letter-spacing:0}
.brand b{font-size:1.125rem;font-weight:700}
.brand small{font-size:1.125rem;font-weight:400;color:var(--band1-text)}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--band1-muted);font-size:.8rem;cursor:pointer;width:32px;height:32px;padding:0;border-radius:999px;white-space:nowrap}
.sync span,.lay-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lay-btn{padding:0!important;width:36px;justify-content:center}
.sync:hover{background:var(--band1-hover);color:var(--band1-text)}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa3ad;flex:none}
.sync.ok i{background:#45c486}
.sync.local i{background:#f5b301}
.lay-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--band1-muted);background:transparent;color:var(--band1-text);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;min-height:36px;white-space:nowrap;font-size:.8rem}
.lay-btn:hover{background:var(--band1-hover)}
.lay-btn svg{width:18px;height:18px}
.tabbar{display:none}

/* full (desktop) layout: pages run edge to edge with a fixed side gutter; only the lesson reading column keeps a measure. */
:root[data-layout="full"] .wrap{max-width:none;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
:root[data-layout="full"] .feat{grid-template-columns:minmax(0,360px) minmax(0,1fr)}

/* compact (tablet) layout: bottom tab bar, bigger targets, slimmer header */
:root[data-layout="compact"]{--fs:17px}
:root[data-layout="compact"] .gh .wrap{min-height:60px}
:root[data-layout="compact"] .nav{display:none}
:root[data-layout="compact"] .gh-right{margin-left:auto}
:root[data-layout="compact"] .brand svg{width:42px;height:42px}
:root[data-layout="compact"] .brand small{display:none}
:root[data-layout="compact"] .sync span,:root[data-layout="compact"] .lay-btn span{display:none}
:root[data-layout="compact"] .lay-btn{padding:4px 8px}
:root[data-layout="compact"] .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
:root[data-layout="compact"] .tabbar a{display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:54px;color:var(--muted);text-decoration:none;font-size:.7rem;border-radius:var(--radius-sm)}
:root[data-layout="compact"] .tabbar a svg{width:24px;height:24px}
:root[data-layout="compact"] .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
:root[data-layout="compact"] main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
:root[data-layout="compact"] body.in-player .tabbar{display:none}
:root[data-layout="compact"] body.in-player main{padding-bottom:0}
:root[data-layout="compact"] .stopbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
:root[data-layout="compact"] .opt{min-height:58px}
:root[data-layout="compact"] .feat{grid-template-columns:1fr}
:root[data-layout="compact"] .feat .thumb{display:none}
:root[data-layout="compact"] .cover-grid{grid-template-columns:1fr}
:root[data-layout="compact"] .cover-art svg{max-width:300px;margin:0 auto}
:root[data-layout="compact"] .cover-art{order:-1}
:root[data-layout="compact"] .catalog{grid-template-columns:1fr;min-height:0}
:root[data-layout="compact"] .filters{border-right:0}
:root[data-layout="compact"] .filters:not(.open) .f-body{display:none}
:root[data-layout="compact"] .f-toggle{display:inline-flex}
:root[data-layout="compact"] .results{padding-left:max(16px,env(safe-area-inset-left,0px))}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;align-self:stretch;align-items:stretch}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;padding:0 12px;text-decoration:none;color:var(--band1-text);white-space:nowrap;font-size:.92rem;border-bottom:3px solid transparent;border-top:3px solid transparent;opacity:.88}
.nav a:hover{background:var(--band1-hover);opacity:1}
.nav a[aria-current="page"]{border-bottom-color:var(--band1-text);opacity:1;font-weight:600}
.gh-right{display:flex;align-items:center;gap:10px;flex:none}
.bell{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--band1-text);text-decoration:none}
.bell:hover{background:var(--band1-hover)}
.bell svg{width:24px;height:24px}
.bell .cnt{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#d93a2b;color:#ffffff;font-size:.7rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--band1-hover);border:2px solid var(--band1-muted);display:grid;place-items:center;color:var(--band1-text);flex:none}
.avatar svg{width:22px;height:22px}
.dday{font-variant-numeric:tabular-nums;font-weight:600;color:var(--band1-text);white-space:nowrap;font-size:.92rem}
:root[data-skin="work"] .dday{display:none}
.skin-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--band1-muted);background:transparent;color:var(--band1-text);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;min-height:36px;white-space:nowrap;font-size:.85rem}
.skin-btn:hover{background:var(--band1-hover)}
.skin-btn .knob{width:30px;height:18px;border-radius:999px;background:var(--band1-hover);border:1px solid var(--band1-muted);position:relative;flex:none}
.skin-btn .knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--band1-muted);transition:left .15s}
.skin-btn[aria-pressed="true"] .knob::after{left:14px;background:var(--band1-text)}
.skin-btn small{font-size:.85em;color:var(--band1-muted)}
@media (max-width:900px){.brand .bt small,.skin-btn small{display:none}}
@media (max-width:640px){.brand .bt{display:none}.avatar{display:none}.gh .wrap{gap:10px}#skinLabel{display:none}}

/* ===== page bar (band 2) ===== */
.pbar{background:var(--band2);color:var(--band2-text)}
.pbar .wrap{display:flex;align-items:center;gap:16px 28px;min-height:58px;padding-block:8px;flex-wrap:wrap}
.pbar-title{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:400;white-space:nowrap}
.pbar-title svg{width:26px;height:26px;flex:none}
.pbar-crumb{font-size:.85rem;opacity:.85;white-space:nowrap}
.pbar-crumb a{color:var(--band2-text)}
.search{flex:1;min-width:220px;max-width:1100px;display:flex;align-items:center;gap:8px;background:#ffffff;color:#1b1d21;border-radius:var(--radius-sm);padding:0 12px;min-height:36px;border:1px solid transparent}
.search:focus-within{outline:3px solid rgba(255,255,255,.55);outline-offset:1px}
.search svg{width:16px;height:16px;color:#6b7280;flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;min-height:34px;padding:0;color:#1b1d21}
.search input::placeholder{color:#6b7280}

/* ===== generic ===== */
main{padding-block:24px 64px}
main.full{padding-block:0 64px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}
.card h2{font-size:1.15rem}
.card h3{font-size:1rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.06em;line-height:1.4;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--accent);white-space:nowrap}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 14px;font-size:.875rem}
.btn.lg{min-height:50px;padding:0 24px;font-size:1.02rem;font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.76rem;color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;color:var(--pill-ink);background:var(--pill-course);white-space:nowrap}
.pill.curr{background:var(--pill-curr)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.stripe{padding:14px;text-align:center;color:var(--muted);font-size:.88rem;background:repeating-linear-gradient(135deg,var(--surface-2) 0 22px,transparent 22px 44px);border-radius:var(--radius-sm)}

/* notice (yellow alert) */
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--notice);color:var(--notice-text);border:1px solid var(--notice-line);border-radius:var(--radius-sm);padding:12px 16px;font-size:.9rem}
.notice svg{width:20px;height:20px;flex:none}
.notice p{flex:1;min-width:200px}
.notice .btn{min-height:34px;padding:0 14px;font-size:.85rem;background:transparent;color:var(--notice-text);border-color:var(--notice-text)}
.notice.info{background:var(--accent-soft);color:var(--text);border-color:transparent}
.notice.info .btn{color:var(--accent);border-color:var(--accent)}

/* section header strip ("Current Assignments") */
.sec-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--strip,var(--band1));color:var(--band1-text);border-radius:var(--radius) var(--radius) 0 0;font-weight:600}
.sec-strip small{font-weight:400;color:var(--band1-muted)}
.sec-body{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:16px;display:grid;gap:16px;min-width:0}

/* thumbnails */
.thumb{display:block;width:100%;height:auto;aspect-ratio:16/7;max-width:100%;border-radius:2px}
.done-thumb .thumb{filter:saturate(.25) brightness(1.25);opacity:.75}

/* catalog card */
.ccard{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.ccard.is-cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.ccard-title{display:flex;gap:10px;align-items:flex-start}
.ccard-title a.t{flex:1;min-width:0;font-weight:600;color:var(--accent);text-decoration:none;line-height:1.35;font-size:.98rem}
.ccard-title a.t:hover{text-decoration:underline}

/* catalog layout */
.catalog{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 140px)}

.seg{display:flex;margin:12px 14px;border:1px solid var(--side-line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}

.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
.f-group{border-top:1px solid var(--side-line)}

.f-opts{display:grid;padding:4px 0 8px}

.f-opts label:hover{background:var(--band1-hover)}
.f-opts input{width:16px;height:16px;margin:1px 0 0;flex:none;accent-color:var(--side-on)}

.results{padding-block:20px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start;min-width:0}

@media (max-width:860px){

}

/* curriculum dialog */
.cm{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:60;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.crow .box{grid-column:2/4;display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}

@media (max-width:640px){

<script>
(() => {
'use strict';
/* ---------- schedule ---------- */
/* 26-11-26: schedule reset to start today (nothing had been studied since 11/16). */
const START = '2026-11-26', LAST = '2027-01-15', EXAM = '2027-01-16';
const LIGHT = ['2026-12-18', '2026-12-21', '2026-12-22', '2026-12-25', '2027-01-01'];
const INTERVAL = {1: 1, 2: 3, 3: 7, 4: 14, 5: 30};
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const UNITS = [
  {k: 'review', w: 'Warm-up: Vocabulary Review', ws: 'Vocabulary Review', f: '단어 복습', min: 15},
  {k: 'affix', w: 'Word Formation', f: '접사 학습', min: 10},
  {k: 'vocab', w: 'Key Terms', f: '새 단어', min: 30},
  {k: 'grammar', w: 'Grammar Concepts', f: '문법', min: 20},
  {k: 'colloc', w: 'Quick Recall', f: '1초 문제 (연어 · 전치사)', fs: '1초 문제', min: 10},
  {k: 'part5', w: 'Knowledge Check', f: 'Part 5 실전', min: 25},
  {k: 'lc', w: 'Listening Lab', f: 'LC', min: 60},
  {k: 'wrap', w: 'Module Wrap-up', f: '정리', min: 10},
];
const POS = {n: ['noun', '명사'], v: ['verb', '동사'], a: ['adj.', '형용사'], ad: ['adv.', '부사'], prep: ['prep.', '전치사'], conj: ['conj.', '접속사']};

const ds = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const md = s => { const d = pd(s); return (d.getMonth() + 1) + '/' + d.getDate(); };

function buildSchedule() {
  const out = []; let n = 0;
  const monday = addDays(START, -((pd(START).getDay() + 6) % 7)); /* weeks run Monday to Sunday */
  for (let s = START; s <= LAST; s = addDays(s, 1)) {
    const wd = pd(s).getDay();
    const type = (wd === 0 || wd === 6) ? 'weekend' : LIGHT.includes(s) ? 'light' : 'normal';
    const e = {date: s, wd, type, week: Math.floor(diffDays(monday, s) / 7) + 1};
    if (type === 'normal') { n++; e.n = n; e.day = 'd' + String(n).padStart(2, '0'); }
    out.push(e);
  }
  return out;
}

/* ---------- state ---------- */
const S = {
  skin: 'work', today: ds(new Date()), schedule: buildSchedule(), index: null, days: {},
  srs: {}, wrong: {}, modules: {}, logs: {}, storeMode: 'loading', stale: false, tts: null, busy: false, kbd: null,
  cat: {type: 'all', q: '', curr: [], status: [], week: [], openGroups: ['curr', 'status'], panel: false},
  navOpen: window.innerWidth >= 960, layout: 'auto',
};
const T = (w, f) => S.skin === 'work' ? w : f;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const blank = s => esc(s).replace(/-{4,}/g, '<span class="blank">&nbsp;</span>');
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const posLabel = p => (POS[p] || [p, p])[S.skin === 'work' ? 0 : 1];
const view = () => document.getElementById('view');
let timers = [];
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ---------- storage ---------- */
const COLS = ['srs', 'wrong', 'modules', 'logs', 'diag', 'fixes'];
const LKEY = 'enablement-hub-v1';
/* Storage, three modes:
   - db:    inside claude.ai (Artifact database, synced by the Claude account)
   - gh:    anywhere else, synced through one JSON file in a private GitHub repository (token entered once per device)
   - local: this browser only
   Every document carries _t (ms) so two devices merge by "newer document wins". The browser copy is always kept as a cache. */
const GH_KEY = 'hub-gh', GH_FILE = 'progress.json';
const b64enc = s => { const u = new TextEncoder().encode(s); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g, '')), c => c.charCodeAt(0)));
function mergeCols(a, b) {
  const out = {}; let changed = false;
  COLS.forEach(c => {
    const x = (a && a[c]) || {}, y = (b && b[c]) || {}, m = {...x};
    Object.keys(y).forEach(id => { if (!m[id] || (y[id]._t || 0) > (m[id]._t || 0)) { if (JSON.stringify(m[id]) !== JSON.stringify(y[id])) changed = true; m[id] = y[id]; } });
    out[c] = m;
  });
  return {out, changed};

const entryOf = date => S.schedule.find(e => e.date === date);

}

/* ----- catalog ----- */
function catItems() {
  const nm = nextModule(), q = S.cat.q.trim().toLowerCase(), f = S.cat;
  const hit = s => String(s || '').toLowerCase().includes(q);
  const wordHit = id => (S.days[id] && S.days[id].words || []).some(w => hit(w.word) || hit(w.meaning));
  const okQ = q.length >= 3;
  const items = [];
  if (S.diagContent) items.push({type: 'course', html: checkCard(), status: S.diag && S.diag.result ? 'done' : 'todo', curr: null, weeks: [], text: T('Placement Check', '진단 테스트')});
  CURR.forEach(c => { const cs = coursesOf(c); items.push({type: 'curr', html: currCard(c), status: currStatus(c), curr: c.id, weeks: [...new Set(cs.map(e => e.week))], text: c.w + ' ' + c.f + ' ' + c.wd + ' ' + c.fd, days: cs.map(e => e.day)}); });
  normals().forEach(e => items.push({type: 'course', html: courseCard(e, nm.day), status: courseStatus(e.day), curr: currOfDay(e.day).id, weeks: [e.week], text: courseTitle(e.day) + ' ' + courseDesc(e.day) + ' ' + (indexEntry(e.day) ? indexEntry(e.day).title + ' ' + indexEntry(e.day).workTitle : ''), days: [e.day]}));
  return items.filter(it => (f.type === 'all' || it.type === f.type)
    && (!f.curr.length || f.curr.includes(it.curr))
    && (!f.status.length || f.status.includes(it.status))
    && (!f.week.length || it.weeks.some(w => f.week.includes(w)))
    && (!okQ || hit(it.text) || (it.days || []).some(wordHit)));
}

      : `<div class="empty">${T('Nothing due today. New terms from Unit 3 become due tomorrow.', '오늘 복습할 단어와 오답이 없습니다. 3단원(새 단어)에서 등록한 단어와 오늘 틀린 문제는 다음 날부터 여기에 나옵니다.')}</div><div class="row"><button class="btn primary" data-skip>${T('Mark complete', '완료로 표시')}</button></div>`);
  el.querySelector('[data-skip]')?.addEventListener('click', () => finishUnit(el, id, 'review', {score: [0, 0]}));
  el.querySelector('[data-go]')?.addEventListener('click', () => {
    const box = document.createElement('div'); el.innerHTML = unitHead('review'); el.appendChild(box);
    const wrongStep = wordRes => {
      const items = dueWrong().slice(0, 10).map(w => ({w, f: findQuestion(w.qid)})).filter(x => x.f);
      const done = wrongRes => {
        const all = [...wordRes, ...wrongRes], c = all.filter(r => r.ok).length;

      };

}
async function reviewSession(box, cap, onFinish) {
  const due = dueWords().slice(0, cap);
  await loadDays(due.map(r => r.d));
  await loadAllDays();
  const items = due.map(r => ({r, w: findWord(r.id)})).filter(x => x.w);
  if (!items.length) { box.innerHTML = `<div class="empty">${T('Nothing due.', '복습할 단어가 없습니다.')}</div>`; onFinish([]); return; }
  const pool = wordPool();
  runQuiz(box, items, {
    build: it => buildReviewQ(it, pool),
    onAnswer: (it, ok, idx, ms, u) => srsAnswer(it.r.id, ok && !u),
    onFinish: res => {
      const c = res.filter(r => r.ok).length;
      logPatch(l => addScore(l, 'review', c, res.length));
      onFinish(res);
    },
  });
}
function buildReviewQ(it, pool) {
  const w = it.w, r = it.r;
  /* Rotate four types per word: meaning, reverse, word form, cloze (typed recall). Missing data falls back to meaning. */
  const kinds = ['cloze', 'meaning', 'reverse', 'form'];
  let kind = kinds[((r.ok || 0) + (r.ng || 0) + r.box) % 4];
  if (kind === 'form' && !(w.drill && w.drill.options)) kind = 'cloze';
  const cz = kind === 'cloze' ? clozeOf(w) : null;
  if (kind === 'cloze' && !cz) kind = 'meaning';
  const others = shuffle(pool.filter(x => x.id !== w.id && x.meaning !== w.meaning));
  const same = others.filter(x => x.pos === w.pos), rest = others.filter(x => x.pos !== w.pos);
  const distract = [...same, ...rest].slice(0, 3);
  const explain = () => `<div>${morphHTML(w)}</div>${w.family ? `<div class="small">${w.family.map(f => `<b>${esc(f.word)}</b> <span class="muted">${esc(posLabel(f.pos))}</span> ${esc(f.meaning)}`).join(' · ')}</div>` : ''}${w.example ? `<div class="example"><div class="en">${esc(w.example.en)}</div><div class="ko">${esc(w.example.ko)}</div></div>` : ''}`;
  if (kind === 'cloze') return {cloze: cz, word: w, explain};
  if (kind === 'form') {
    return {tag: T('Word form', '품사 변형'), prompt: `<div class="en">${blank(w.drill.sentence)}</div>`, options: w.drill.options, answer: w.drill.answer,
      explain: () => `<dl><dt>${T('Why', '근거')}</dt><dd>${esc(w.drill.why)}</dd></dl>` + explain()};
  }
  if (kind === 'meaning') {
    const opts = shuffle([w, ...distract]);
    return {tag: T('Meaning', '뜻 고르기'), prompt: `<div class="row"><span class="big">${esc(w.word)}</span><span class="chip accent">${esc(posLabel(w.pos))}</span>${speakBtn(w.word)}</div>`,
      options: opts.map(x => x.meaning), answer: opts.indexOf(w), explain};
  }
  const opts = shuffle([w, ...distract]);
  return {tag: T('Term', '단어 고르기'), prompt: `<div>${esc(w.meaning)} <span class="chip accent">${esc(posLabel(w.pos))}</span></div>`,
    options: opts.map(x => x.word), answer: opts.indexOf(w), explain};
}

/* unit 2: affix */

      ${it.tip ? `<div class="tip">${esc(it.tip)}</div>` : ''}</div>`).join('')}</div>

/* Prefixes are taught from course 2. An inference item may still use one earlier; its meaning is shown with the word,
   so the item checks the suffix and the base just learned instead of a guess. */
const PREFIXES = new Set(['non', 'dis', 're', 'pre', 'un', 'in', 'im', 'il', 'ir', 'mis', 'over', 'under', 'co', 'com', 'con', 'inter', 'sub', 'trans', 'ex', 'de', 'post', 'out', 'fore', 'anti', 'multi', 'semi', 'super', 'en', 'em', 'counter', 'self']);
function prefixGloss(q) {
  const day = String(q.id || '').slice(0, 3), known = new Set();
  for (const [k, d] of Object.entries(S.days || {})) if (k <= day) for (const a of (d.affix && d.affix.items) || []) if (a.kind === 'prefix') a.affix.split(/[·,\s]+/).forEach(x => { x = x.replace(/-/g, '').toLowerCase(); if (x) known.add(x); });
  const out = String(q.parts || '').split(' + ').map(seg => { const m = seg.trim().match(/^([a-z]+)-?\((.+)\)$/i); const k = m && m[1].toLowerCase(); return k && PREFIXES.has(k) && !known.has(k) ? `${m[1]}-(${m[2]})` : null; }).filter(Boolean);
  return out.length ? `<div class="small"><span class="chip">${T('Prefix', '접두사')}</span> ${out.map(esc).join(' · ')}</div>` : '';
}
function inferenceBuild(q) {
  return {tag: T('Inference', '접사 추론') + ' · ' + posLabel(q.pos), prompt: `<div class="row"><span class="big">${esc(q.word)}</span>${speakBtn(q.word)}</div>${prefixGloss(q)}<div class="muted small">${esc(q.question || '')}</div><details><summary class="small">${T('Hint: word parts', '힌트: 분해 보기')}</summary><div class="small">${esc(q.parts)}</div></details>`,
    options: q.options, answer: q.answer, explain: () => `<dl><dt>${T('Parts', '분해')}</dt><dd>${esc(q.parts)}</dd><dt>${T('Why', '근거')}</dt><dd>${esc(q.why)}</dd></dl>`};
}

/* Word card: one column, read top to bottom. Word > meaning > labelled sections (parts, family, collocation, example). */
/* US pronunciation (Wiktionary GA, normalised). IPA symbols use a system font: the UI font has no IPA glyphs. */
const ipaHTML = w => w.ipa ? `<span class="ipa" lang="en-fonipa">${esc(w.ipa)}</span>` : '';
/* Word card in three tiers: meaning (what to remember) > forms and example (Part 5, collocation in context) > word parts. */
function wordCard(w) {
  const r = S.srs[w.id], rest = collocRest(w);
  const foot = (w.morph && w.morph.length ? morphHTML(w, false) : '') + (rest.length ? `<span class="w-row"><span class="lbl">${T('Pairs', '짝')}</span><span class="colloc">${rest.map(esc).join(' · ')}</span></span>` : '');
  return `<article class="wcard">
    ${wordHead(w, r)}
    <p class="mean">${esc(w.meaning)}</p>
    ${famLine(w)}
    ${w.example ? `<div class="example"><p class="en">${exampleHTML(w)}${speakBtn(w.example.en, '예문 듣기')}</p><p class="ko">${esc(w.example.ko)}</p></div>` : ''}
    ${foot ? `<div class="w-foot">${foot}</div>` : ''}
  </article>`;
}
/* Quick-round back: only what the round checks (meaning, then the family for Part 5). */
function wordCardQuick(w) {
  return `<article class="wcard wcard-quick">${wordHead(w, S.srs[w.id])}<p class="mean">${esc(w.meaning)}</p>${famLine(w)}</article>`;
}
function wordHead(w, r) {
  return `<header class="w-head">
      <span class="w">${esc(w.word)}</span>${ipaHTML(w)}<span class="chip accent">${esc(posLabel(w.pos))}</span>${speakBtn(w.word)}
      <span class="w-tools">${r ? `<span class="boxdots" title="${T('Box', '박스')} ${r.box}">${[1, 2, 3, 4, 5].map(b => `<i class="${b <= r.box ? 'on' : ''}"></i>`).join('')}</span>` : ''}<button class="flag icon" type="button" data-fix="${esc(w.id)}">${T('Report', '수정 요청')}</button></span>
    </header>`;
}
/* Family on one line: form, part of speech, first sense only. */
function famLine(w) {
  if (!w.family || !w.family.length) return '';
  const short = m => String(m || '').split(/[;,]/)[0].trim();
  return `<p class="w-row fam-line"><span class="lbl">${T('Forms', '품사')}</span><span>${w.family.map(f => `<span class="fm"><b>${esc(f.word)}</b><i>${esc(f.pos)}</i>${esc(short(f.meaning))}</span>`).join('<span class="sep">·</span>')}</span></p>`;
}
const collocList = w => String(w.collocation || '').split(/\s+·\s+/).map(c => c.trim()).filter(Boolean);
const collocFind = c => c.replace(/[~…]|\b(sb|sth|A|B)\b/g, ' ').replace(/\s+/g, ' ').trim();
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* A pair matches its inflected form (reach → reached) and allows one extra word between (make a [final] decision). */
const collocRe = c => { const t = collocFind(c).split(' ').filter(Boolean); return t.length > 1 ? new RegExp('\\b' + t.map(x => reEsc(esc(x.length > 3 ? x.replace(/(e|y)$/, '') : x)) + "[a-z]{0,3}").join("\\s+(?:[A-Za-z'-]+\\s+)?") + '\\b', 'i') : null; };
/* Pairs not already visible in the example sentence. */
function collocRest(w) {
  const en = esc((w.example && w.example.en) || '');
  return collocList(w).filter(c => { const re = collocRe(c); return !re || !re.test(en); });
}
/* Example with the pair highlighted and the target form in bold, so the sentence carries the collocation. */
function exampleHTML(w) {
  let h = esc(w.example.en);
  for (const c of collocList(w)) { const re = collocRe(c); if (re) h = h.replace(re, m => `<mark class="col">${m}</mark>`); }
  const z = clozeOf(w);
  if (z) h = h.replace(new RegExp('\\b' + reEsc(esc(z.form)) + '\\b'), m => `<b>${m}</b>`);
  return `<span>${h}</span>`;
}

/* unit 3: vocab. Default is one card at a time (front: word, back: everything else); a single-column list is one tap away. */
function unitVocab(el, d, id) {
  const words = d.words || [], n = words.length;
  let i = 0, flipped = false, mode = 'card';
  const front = w => `<div class="fc-front"><span class="w">${esc(w.word)}</span>${ipaHTML(w)}<span class="row" style="gap:8px;justify-content:center"><span class="chip accent">${esc(posLabel(w.pos))}</span>${speakBtn(w.word)}</span><p class="hint">${T('Recall the meaning, then tap the card or press Space.', '뜻을 먼저 떠올린 뒤 카드를 누르거나 Space 키를 누르세요.')}</p></div>`;
  const toolbar = () => `<div class="seg seg-inline" role="group" aria-label="${T('View', '보기 방식')}"><button type="button" data-mode="card" aria-pressed="${mode === 'card'}">${T('Cards', '카드 보기')}</button><button type="button" data-mode="list" aria-pressed="${mode === 'list'}">${T('List', '목록 보기')}</button></div>`;
  const fit = cardFitter(words, wordCard, front);
  const startBtn = `<button class="btn primary" type="button" data-go>${T('Round 2: quick recall', '2회차: 빠르게 떠올리기')} →</button>`;
  const draw = () => {
    S.kbd = null;
    const head = unitHead('vocab', T('Round 1: read each card once. Rounds 2 and 3 are quick recall.', '1회차: 카드를 한 장씩 읽으세요. 뜻 → 품사 → 예문 순서로 보면 돼요. 이어서 2 · 3회차는 단어만 보고 빠르게 떠올려요.')) + `<div class="row" style="justify-content:space-between">${toolbar()}<span class="small muted">${n}${T(' terms', '개 단어')}</span></div>`;
    if (mode === 'list') {
      S.fit = null;
      el.innerHTML = head + `<div class="wlist">${words.map(w => wordCard(w)).join('')}</div><div class="row">${startBtn}</div>`;
      if (i) el.querySelectorAll('.wlist .wcard')[i]?.scrollIntoView({block: 'start'});
    } else {
      const w = words[i], last = i === n - 1;
      el.innerHTML = head + `<div class="fc-wrap">
        <div class="fc-meta"><span>${i + 1} / ${n}</span><span class="bar accent"><i style="width:${Math.round((i + 1) / n * 100)}%"></i></span></div>
        <div class="fc ${flipped ? 'is-back' : ''}" id="fc" role="button" tabindex="0" aria-label="${flipped ? T('Show the word only', '단어만 보기') : T('Show meaning', '뜻 보기')}">${flipped ? wordCard(w) : front(w)}</div>
        <div class="fc-nav">
          <button class="btn ghost" type="button" data-prev ${i ? '' : 'disabled'}>← ${T('Previous', '이전')}</button>
          ${flipped ? `<button class="btn ghost" type="button" data-flip>${T('Word only', '단어만 보기')}</button>` : `<button class="btn ghost" type="button" data-next ${last ? 'disabled' : ''}>${T('Skip', '건너뛰기')} →</button>`}
          ${flipped ? (last ? startBtn : `<button class="btn primary" type="button" data-next>${T('Next', '다음')} →</button>`) : `<button class="btn primary" type="button" data-flip>${T('Show meaning', '뜻 보기')}</button>`}
        </div>
        <p class="kbd" style="text-align:center">${T('Space or Enter: flip · ← →: move', 'Space · Enter: 뒤집기 · ← →: 이동')}</p>
      </div>`;
      const fc = el.querySelector('#fc');
      S.fit = () => fit(el.querySelector('.fc-wrap')); S.fit();
      const flip = () => { flipped = !flipped; draw(); };
      const move = k => { const j = i + k; if (j < 0 || j >= n) return; i = j; flipped = false; draw(); };
      fc.addEventListener('click', e => { if (!e.target.closest('[data-say],[data-fix]')) flip(); });
      el.querySelector('[data-flip]').addEventListener('click', flip);
      el.querySelector('[data-prev]').addEventListener('click', () => move(-1));
      el.querySelector('[data-next]')?.addEventListener('click', () => move(1));
      let x0 = null;
      fc.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
      fc.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1); }, {passive: true});
      S.kbd = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } else if (e.key === 'ArrowRight') move(1); else if (e.key === 'ArrowLeft') move(-1); };
    }
    el.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { if (mode === b.dataset.mode) return; mode = b.dataset.mode; flipped = false; draw(); }));
    el.querySelector('[data-go]')?.addEventListener('click', () => quick(2, shuffle(words)));
  };
  /* Rounds 2 and 3: word only, about 3 seconds to recall, self-rated. "Again" brings the card back three cards later.
     Several short passes beat one long read for recognition speed, which is what TOEIC tests. */
  const quick = (round, list) => {
    S.kbd = null; const miss = [];
    el.innerHTML = unitHead('vocab', T('Recall the meaning within about 3 seconds, then rate yourself.', '단어만 보고 3초 안에 뜻을 떠올린 뒤 스스로 채점하세요. 모르면 "다시 볼래요"를 누르세요. 3장 뒤에 다시 나와요.')) + '<div id="vq"></div>';
    cardSession(el.querySelector('#vq'), list, {label: T('Round ' + round, round + '회차'), back: wordCardQuick, hint: T('About 3 seconds. Tap to check.', '3초 안에 뜻을 떠올리고 카드를 누르세요.'),
      onFirst: (w, ok) => { if (!ok) miss.push(w); },
      onDone: () => {
        const box = document.createElement('div'); box.className = 'stack';
        const next = round === 2
          ? `${miss.length ? `<button class="btn primary" type="button" data-r3="miss">${T('Round 3: missed only', '3회차: 다시 본 단어만')} (${miss.length})</button>` : ''}<button class="btn ${miss.length ? '' : 'primary'}" type="button" data-r3="all">${T('Round 3: all, reshuffled', '3회차: 전체 섞어서')}</button><button class="btn ghost" type="button" data-start>${T('Skip to check', '확인 퀴즈로 바로')}</button>`
          : `<button class="btn primary" type="button" data-start>${T(`Add ${n} terms and start check`, `${n}개 단어장 등록 · 확인 퀴즈`)}</button>`;
        box.innerHTML = `<div class="summary"><div class="eyebrow">${T('Round ' + round + ' done', round + '회차 완료')}</div><div class="row"><span class="score">${list.length - miss.length} / ${list.length}</span><span class="muted">${T('recalled on first try', '처음에 바로 떠올린 단어')}</span></div>${miss.length ? `<p class="small muted">${T('Again', '다시 본 단어')}: ${miss.map(w => esc(w.word)).join(' · ')}</p>` : ''}</div><div class="row">${next}</div>`;
        el.innerHTML = unitHead('vocab'); el.appendChild(box);
        box.querySelectorAll('[data-r3]').forEach(b => b.addEventListener('click', () => quick(3, shuffle(b.dataset.r3 === 'miss' ? miss : words))));
        box.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', start));
      }});
  };

  const start = () => {
    S.kbd = null;
    const added = registerWords(id);
    if (added) toast(T(`${added} terms added`, `${added}개 단어를 단어장에 등록했습니다`));
    const box = document.createElement('div'); el.innerHTML = unitHead('vocab', T('Pick the correct word form.', '빈칸에 들어갈 알맞은 형태를 고릅니다.')); el.appendChild(box);
    runQuiz(box, shuffle(words.filter(w => w.drill)), {
      build: w => ({tag: w.word, prompt: `<div class="en">${blank(w.drill.sentence)}</div>`, options: w.drill.options, answer: w.drill.answer,
        explain: () => `<dl><dt>${T('Why', '근거')}</dt><dd>${esc(w.drill.why)}</dd></dl>`}),
      onFinish: res => { const c = res.filter(r => r.ok).length; logPatch(l => addScore(l, 'drill', c, res.length));
        const sum1 = summaryHTML(res, T('Word form check', '품사 변형 결과'), res.filter(r => !r.ok || r.unsure).length ? `<p class="small muted">${T('Missed', '틀린 단어 · 모름')}: ${res.filter(r => !r.ok || r.unsure).map(r => esc(r.it.word)).join(' · ')}</p>` : '');
        const inf = d.inference || [];
        if (!inf.length) return finishUnit(el, id, 'vocab', {score: [c, res.length]}, sum1);

        <div class="shadow-line ${showText ? '' : 'veil'}" data-t>${esc(s.en)}</div>

        <div class="row"><button class="btn" type="button" data-p>▶ ${T('Play', '듣기')}</button><button class="btn" type="button" data-s>${T('Slow', '느리게')}</button><button class="btn ghost" type="button" data-v>${showText ? T('Hide text', '문장 가리기') : T('Show text', '문장 보기')}</button></div>
        <div class="reps"><span class="boxdots">${[0, 1, 2].map(x => `<i class="${x < reps ? 'on' : ''}"></i>`).join('')}</span><span class="small muted">${T('Repeated', '따라 말한 횟수')} ${reps} / 3</span></div>
        <div class="q-actions">${reps < 3 ? `<button class="btn primary" type="button" data-r>${T('I said it aloud', '따라 말했어요')}</button>` : ''}<button class="btn ${reps >= 3 ? 'primary' : 'ghost'}" type="button" data-n>${i === sents.length - 1 ? T('Finish', '마치기') : T('Next sentence', '다음 문장')}</button></div></div>`;
      box.querySelector('[data-p]').addEventListener('click', () => play(1));
      box.querySelector('[data-s]').addEventListener('click', () => play(0.75));
      box.querySelector('[data-v]').addEventListener('click', () => { showText = !showText; draw(); });
      box.querySelector('[data-t]').addEventListener('click', () => { if (!showText) { showText = true; draw(); } });
      box.querySelector('[data-r]')?.addEventListener('click', () => { reps = Math.min(3, reps + 1); if (reps === 1) showText = true; if (reps === 2) showText = false; draw(); if (reps < 3) play(1); });
      box.querySelector('[data-n]').addEventListener('click', () => { if (reps >= 3) full++; i++; step(); });
    };
    draw(); play(1);
  };
  step();
}

function lcBuild(q) {
        const audio = hasVoice();

function unitWrap(el, d, id) {

  el.innerHTML = unitHead('wrap', T('Review your results and close the module.', '오늘 결과를 확인하고 모듈을 마칩니다. 메모는 Claude 가 학습 기록에 옮깁니다.')) + `

/* Reading and listening sets (Part 6 · Part 7 · LC Part 3): shared by the placement check and the missed-items notebook. */
const paras = s => '<p>' + String(s).split(/\n\n/).map(x => x.replace(/\n/g, '<br>')).join('</p><p>') + '</p>';
function p6Passage(set, cur) {

  return `<div class="passage"><div class="p-meta"><span class="chip">${esc(set.kind || '')}</span></div><div class="p-head">${nl(set.head || '')}</div>${paras(body)}</div>`;
}
function p7Passage(set) {
  return `<div class="passage"><div class="p-meta"><span class="chip">${esc(set.kind || '')}</span></div><h3 class="p-title2">${esc(set.head || '')}</h3>${paras(esc(set.passage))}</div>`;
}
const speakerName = s => s === 'W' ? T('Woman', '여자') : T('Man', '남자');
function lc3Script(set) { return `<div class="script">${set.lines.map(l => `<p><b>${speakerName(l.s)}</b> ${esc(l.text)}</p>`).join('')}</div>`; }
const lc3Lines = set => set.lines.map(l => ({text: l.text, voice: l.s === 'W' ? 'airy' : 'buttery', language: 'en'}));
const p6Build = set => q => ({tag: 'Part 6 · ' + q.type, prompt: p6Passage(set, q.n) + `<p class="q-stem">${T(`Choose the best option for blank (${q.n}).`, `빈칸 (${q.n})에 가장 알맞은 것을 고르세요.`)}</p>`, options: q.options, answer: q.answer, explain: p5Explain(q)});
const p7Build = set => q => ({tag: 'Part 7 · ' + q.type, prompt: p7Passage(set) + `<p class="q-stem en">${esc(q.q)}</p>`, options: q.options, answer: q.answer, explain: p5Explain(q)});
const lc3Build = (set, replay) => q => {
  const audio = hasVoice();
  return {tag: 'Part 3 · ' + q.type,
    prompt: (audio ? (replay ? `<div class="row"><button class="btn sm" type="button" data-play>▶ ${T('Play conversation', '대화 듣기')}</button></div>` : '') : lc3Script(set)) + `<p class="q-stem en">${esc(q.q)}</p>`,

};

/* ----- placement check (v2: all parts, about 35 minutes) ----- */
const LV = {1: ['Easy', '쉬움'], 2: ['Medium', '보통'], 3: ['Hard', '어려움']};
const lvName = l => (LV[l] || [l, l])[S.skin === 'work' ? 0 : 1];
const pct = v => v && v[1] ? Math.round(v[0] / v[1] * 100) : 0;
const BANDS = [
  {max: 0.55, ratio: '6 : 3 : 1', f: '기초 다지기: 쉬운 문제 중심, 품사 자리 복습 문항 추가', w: 'Foundation'},
  {max: 0.75, ratio: '4 : 4 : 2', f: '표준: 쉬움 · 보통 중심, 어려운 문제 일부', w: 'Standard'},
  {max: 9, ratio: '3 : 4 : 3', f: '도전: 보통 · 어려움 비중 확대', w: 'Stretch'},
];
function tally(res, key) { const o = {}; res.forEach(r => { const k = r.it[key] ?? '기타'; o[k] = o[k] || [0, 0]; o[k][1]++; if (r.ok) o[k][0]++; }); return o; }
const hasSet = (g, k) => !!(g && g[k] && g[k].items && g[k].items.length);
function diagSections(g) {

    hasSet(g, 'p6') && {k: 'p6', t: 'Part 6', n: g.p6.items.length, time: `${T('set', '세트')} ${fmtT(g.p6.items.length * 30)}`, note: T('Text completion', '장문 빈칸 1세트')},
    hasSet(g, 'p7') && {k: 'p7', t: 'Part 7', n: g.p7.items.length, time: `${T('set', '세트')} ${fmtT(g.p7.items.length * 60)}`, note: T('Reading', '독해 지문 1개')},
    {k: 'vocab', t: T('Vocabulary', '어휘'), n: g.vocab.length, time: T('no limit', '제한 없음'), note: T('Core and TOEIC lists', '일반 핵심 · 토익 어휘')},
    {k: 'lc', t: 'LC Part 2', n: g.lc.length, time: audio ? T('audio', '음성') : T('script', '스크립트'), note: T('Question-response', '질문 · 응답')},
    hasSet(g, 'lc3') && {k: 'lc3', t: 'LC Part 3', n: g.lc3.items.length, time: audio ? T('heard once', '한 번 듣기') : T('script', '스크립트'), note: T('Conversation', '대화 1세트')},
  ].filter(Boolean);
}

/* ----- review page ----- */
/* ----- practice: words only (short sessions, phone- and tablet-friendly) -----
   1) Due review: Leitner boxes 1·3·7·14·30 days, i.e. each word comes back just before it would be forgotten.
   2) Relearn: words missed in the review come back as cards in the same sitting until marked known (short-term relearning step).
   3) Preview: the next words of upcoming modules, registered as box 1 so tomorrow's review picks them up. */
function upcomingWords(n) {
  const out = [], have = new Set(Object.values(S.srs).map(r => r.w));
  for (const d of (S.index && S.index.days) || []) {
    const day = S.days[d.id]; if (!day) continue;
    for (const w of day.words || []) { if (!S.srs[w.id] && !have.has(w.word)) { out.push(w); have.add(w.word); } if (out.length >= n) return out; }
  }
  return out;
}
/* box 4 = "already known": first check comes 14 days later instead of tomorrow. */
function registerWord(w, box) {
  if (S.srs[w.id] || Object.values(S.srs).some(r => r.w === w.word)) return false;
  box = box || 1;
  Store.put('srs', w.id, {id: w.id, w: w.word, pos: w.pos, m: w.meaning, d: w.id[0] === 't' ? 'tsl' : w.id.slice(0, 3), box, next: addDays(S.today, INTERVAL[box]), added: S.today, ok: 0, ng: 0, last: null, ...(box > 1 ? {known: true} : {})});
  return true;
}
/* Card session with self-rating. "Again" puts the card back three cards later; "Got it" retires it for today. */
/* One card height per set: the tallest face (front or back) of all words at the current width.
   Flipping or moving to the next word then never changes the card height, so the buttons stay put. */
function cardFitter(words, back, front) {
  let width = 0, h = 0;
  return wrap => {
    const fc = wrap && wrap.querySelector('.fc'); if (!fc) return;
    const wd = fc.clientWidth; if (!wd) return;
    if (wd !== width) {
      const m = document.createElement('div'); m.className = 'fc-measure'; m.style.width = wd + 'px';
      m.innerHTML = [...new Set(words)].map(w => `<div class="fc is-back">${back(w)}</div><div class="fc">${front(w)}</div>`).join('');
      document.body.appendChild(m);
      h = Math.max(...[...m.children].map(c => c.offsetHeight)); m.remove(); width = wd;
    }
    fc.style.height = h + 'px'; fc.classList.add('fixed');
  };
}
window.addEventListener('resize', () => { if (S.fit) S.fit(); });
function cardSession(box, words, opts) {
  const queue = words.slice(), seen = new Set(); let flipped = false, done = 0, again = 0;
  const total = words.length;
  S.busy = true;
  const front = w => `<div class="fc-front"><span class="w">${esc(w.word)}</span>${ipaHTML(w)}<span class="row" style="gap:8px;justify-content:center"><span class="chip accent">${esc(posLabel(w.pos))}</span>${speakBtn(w.word)}</span><p class="hint">${opts.hint || T('Recall the meaning, then tap the card or press Space.', '뜻을 먼저 떠올린 뒤 카드를 누르거나 Space 키를 누르세요.')}</p></div>`;
  const fit = cardFitter(words, opts.back || wordCard, front);
  const draw = () => {
    if (!queue.length) { S.busy = false; S.kbd = null; S.fit = null; return opts.onDone({total, again}); }
    const w = queue[0];
    box.innerHTML = `<div class="fc-wrap">
      <div class="fc-meta"><span>${done} / ${total}</span><span class="bar accent"><i style="width:${Math.round(done / total * 100)}%"></i></span><span class="chip">${esc(opts.label)}</span></div>
      <div class="fc ${flipped ? 'is-back' : ''}" id="fc" role="button" tabindex="0" aria-label="${flipped ? T('Show the word only', '단어만 보기') : T('Show meaning', '뜻 보기')}">${flipped ? (opts.back || wordCard)(w) : front(w)}</div>
      <div class="fc-nav">${flipped
        ? `<button class="btn" type="button" data-again>${T('Again', '다시 볼래요')}</button><span class="kbd">1 · 2</span><button class="btn primary" type="button" data-got>${T('Got it', '외웠어요')}</button>`
        : `${opts.knownBtn ? `<button class="btn" type="button" data-known title="${T('Skip: first review in 14 days', '바로 넘기고 14일 뒤에 한 번 확인합니다')}">${T('Already know', '이미 알아요')}</button>` : '<span></span>'}<span class="kbd">${opts.knownBtn ? T('0: already know', '0: 이미 알아요') : 'Space'}</span><button class="btn primary" type="button" data-flip>${T('Show meaning', '뜻 보기')}</button>`}</div>
    </div>`;
    const flip = () => { flipped = !flipped; draw(); };
    const rate = ok => {
      queue.shift();
      if (!seen.has(w.id)) { seen.add(w.id); opts.onFirst && opts.onFirst(w, ok); }
      if (ok) done++; else { again++; queue.splice(Math.min(3, queue.length), 0, w); }
      flipped = false; draw();
    };
    S.fit = () => fit(box.querySelector('.fc-wrap')); S.fit();
    const known = () => { queue.shift(); if (!seen.has(w.id)) { seen.add(w.id); opts.onKnown && opts.onKnown(w); } done++; flipped = false; draw(); };
    box.querySelector('[data-known]')?.addEventListener('click', known);
    const fc = box.querySelector('#fc');
    fc.addEventListener('click', e => { if (!e.target.closest('[data-say],[data-fix]')) flip(); });
    box.querySelector('[data-flip]')?.addEventListener('click', flip);
    box.querySelector('[data-again]')?.addEventListener('click', () => rate(false));
    box.querySelector('[data-got]')?.addEventListener('click', () => rate(true));
    let x0 = null;
    fc.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
    fc.addEventListener('touchend', e => { if (x0 == null || !flipped) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) rate(dx > 0); }, {passive: true});
    S.kbd = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } else if (!flipped && opts.knownBtn && e.key === '0') known(); else if (flipped && e.key === '1') rate(false); else if (flipped && e.key === '2') rate(true); };
  };
  draw();
}

function wrongBuild({f}) {

  if (f.kind === 'vocab') return {tag: T('Vocabulary', '어휘'), prompt: `<span class="big">${esc(q.word)}</span>`, options: q.options, answer: q.answer, explain: () => q.why ? `<p>${esc(q.why)}</p>` : ''};
  if (f.kind === 'colloc') return {tag: q.kind, prompt: `<div class="en">${blank(q.q)}</div>`, options: q.options, answer: q.answer, explain: collocExplain(q)};
  return {tag: 'Part ' + q.part, prompt: q.part === 1 ? `<div class="scene">${esc(q.scene)}</div>` : `<div class="en">${esc(q.prompt)}</div>`, options: q.options, answer: q.answer, explain: () => `<dl><dt>${T('Why', '근거')}</dt><dd>${esc(q.why)}</dd>${q.trap ? `<dt>${T('Trap', '함정')}</dt><dd>${esc(q.trap)}</dd>` : ''}</dl>`};
}
function wrongQuiz(box, items, onFinish) {
  runQuiz(box, items, {
    build: wrongBuild,
    onAnswer: (it, ok, idx, ms, u) => { if (ok && !u) resolveWrong(it.w.qid); else recordWrong(it.w.qid, it.w.day, it.w.kind, it.w.type, idx, it.w.answer, ok && u); },
    onFinish: res => { logPatch(l => addScore(l, 'wrong', res.filter(r => r.ok && !r.unsure).length, res.length)); onFinish(res); },
  });
}
function notesWrong(head) {
  const open = Object.values(S.wrong).filter(w => !w.resolved).sort((a, b) => (a.next || a.date) < (b.next || b.date) ? -1 : 1);
  const due = dueWrong(), doneN = Object.values(S.wrong).length - open.length;
  const stageDots = w => `<span class="boxdots" title="${T('correct retries', '연속 정답')} ${w.stage || 0}/${WRONG_GAP.length}">${WRONG_GAP.map((_, i) => `<i class="${i < (w.stage || 0) ? 'on' : ''}"></i>`).join('')}</span>`;
  view().innerHTML = `<div class="stack">${head}
    <section class="card stack" id="wb">
      <p>${T('Due today', '오늘 다시 풀 오답')} <b>${due.length}</b> · ${T('open', '미해결')} ${open.length} · ${T('resolved', '해결')} ${doneN}</p>
      <p class="small muted">${T('Missed items return after 1, 3 and 7 days. Three correct retries in a row clear an item.', '틀린 문제는 1일 · 3일 · 7일 뒤에 다시 나옵니다. 세 번 연속 맞히면 해결로 넘어갑니다. 틀린 직후에 바로 다시 푸는 것보다 하루 뒤에 푸는 쪽이 오래 기억됩니다.')}</p>
      <div class="tbl-wrap"><table><tr><th>${T('Next', '다음 차례')}</th><th>${T('Type', '유형')}</th><th>${T('Item', '문제')}</th><th>${T('Progress', '진행')}</th><th class="num">${T('Misses', '틀린 횟수')}</th></tr>${open.map(w => { const f = findQuestion(w.qid); const txt = f ? (f.q.q || f.q.prompt || f.q.word || f.q.scene || '') : w.qid; const isDue = !w.next || w.next <= S.today; return `<tr><td class="num">${isDue ? `<b style="color:var(--accent)">${T('Today', '오늘')}</b>` : md(w.next)}</td><td>${esc(w.type || w.kind)}${w.unsure ? ` <span class="chip">${T('unsure', '모름')}</span>` : ''}</td><td>${blank(String(txt).slice(0, 90))}</td><td>${stageDots(w)}</td><td class="num">${w.tries || 1}</td></tr>`; }).join('') || `<tr><td colspan="5" class="muted">${T('No open items.', '미해결 오답이 없습니다.')}</td></tr>`}</table></div>
      <div class="row">${due.length ? `<button class="btn primary" data-go="due">${T('Retry due items', '오늘 차례 풀기')} (${due.length})</button>` : ''}${open.length > due.length ? `<button class="btn" data-go="all">${T('Retry all open', '미해결 전체 풀기')} (${open.length})</button>` : ''}</div>
    </section>${footHTML()}</div>`;
  view().querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const items = (b.dataset.go === 'due' ? due : open).map(w => ({w, f: findQuestion(w.qid)})).filter(x => x.f);
    const wb = document.getElementById('wb'); wb.innerHTML = `<span class="eyebrow">${T('Retry', '오답 다시 풀기')}</span><div id="wq"></div>`;
    wrongQuiz(document.getElementById('wq'), items, res => { wb.innerHTML = summaryHTML(res, T('Retry result', '오답 복습 결과'), `<div class="row"><a class="btn primary" href="#notes-wrong">${T('Back', '오답노트로')}</a></div>`); });
  }));
}
function notesAffix(head) {
  const days = Object.values(S.days).sort((a, b) => a.id < b.id ? -1 : 1);
  view().innerHTML = `<div class="stack">${head}${days.map(d => `<section class="card stack"><div class="eyebrow">${T('Module', '')} ${d.day}${T('', '일차')} · ${esc(d.affix?.title || '')}</div>
    ${(d.affix?.items || []).map(it => `<div class="affix-item"><div class="row"><span class="affix-tag ${esc(it.kind || 'suffix')}">${esc(it.affix)}</span><span>${esc(it.meaning)}</span></div><div class="ex-list">${(it.examples || []).map(x => `<span>${esc(x.base)} → <b>${esc(x.derived)}</b> <span class="muted">${esc(x.ko)}</span></span>`).join('')}</div></div>`).join('')}</section>`).join('') || '<div class="empty">콘텐츠가 없습니다.</div>'}${footHTML()}</div>`;
}

const LINKS = [
  {g: '박혜원 강사 (YBM) 공개 자료', items: [
    ['박혜원토익 유튜브 채널 (재생목록)', 'https://www.youtube.com/channel/UCb4MVtZtinKBSrZOcRkThTQ/playlists', 'LC · RC 파트별 무료 강의 모음'],
    ['박혜원토익 LC 파트 재생목록', 'https://www.youtube.com/playlist?list=PLEcJTeK1SCkDCYgyoGB1CZiuAaqkXBUdg', '3~4주차 LC Part 3 · 4 들어가기 전에'],
    ['토익 가이드: 팩트체크 · 학습방향 Q&A', 'https://www.youtube.com/watch?v=h-QplZhajDE', '첫 주에 한 번 보기'],
    ['대비특강 RC: Part 5 · 6 TIP (PDF)', 'https://free.ybmclass.com/free/toeic/free/down/202201_RC.pdf', '연어 · 전치사 짝, 복합명사, 패러프레이징 정리'],
    ['YBM 종로 파워토익 (현강 안내)', 'https://www.ybmedu.com/chongno/powertoeic', ''],
  ]},
  {g: 'ETS 기출 (YBM) 무료 자료', items: [
    ['ETS 기출 수험서 추천 · 활용 가이드', 'https://www.ybmbooks.com/roadmap', '어떤 기출문제집을 언제 쓰는지'],
    ['기출문제집 1000 Vol.5 LC (MP3 무료)', 'https://www.ybmbooks.com/book/book_view.asp?seq=2998&step_1=15&step_2=208', '로그인 후 PC 에서 MP3 다운로드 · 정기시험 성우 음원'],
    ['ETS 토익기출 수험서 앱 (무료)', 'https://apps.apple.com/app/id480908919', 'iPad 에서 LC 음원 재생 · 속도 조절 · 무료 동영상 강의'],
  ]},
  {g: '해커스 매일 무료 문제', items: [
    ['매일 토익 LC 풀기 + 해설강의', 'https://www.hackers.co.kr/?c=s_lec/lec_toeic/lec_dlc', 'LC 단원에서 실제 음원 연습용 (iPad 에서도 음성 재생)'],
    ['매일 LC 받아쓰기 · 쉐도잉', 'https://www.hackersteps.com/?c=s_toeic%2Ftoeic_info%2Fshadowing', 'LC 단원 받아쓰기 연습'],
    ['매일 토익 RC 풀기', 'https://m.hackers.co.kr/?c=s_lec%2Flec_toeic%2Flec_drc', '4주차부터 Part 6 · 7 보충'],
    ['해커스토익 메인 (오늘의 토익 단어)', 'https://www.hackers.co.kr/', '가벼운 학습일 · 자투리 시간'],
    ['해커스 무료 MP3 자료', 'https://champ.hackers.com/?r=champstudy&c=mp3%2Fmp3_free', ''],
  ]},
  {g: '시험 · 단어 기준', items: [
    ['TOEIC Service List (TSL 1.2)', 'https://www.newgeneralservicelist.com/toeic-service-list', '단어 선정 기준 목록'],
    ['한국TOEIC위원회 시험 접수', 'https://exam.toeic.co.kr', '접수 전에 형식 변경 공지 확인'],
  ]},
];
function notesLinks(head) {
  view().innerHTML = `<div class="stack">${head}${LINKS.map(g => `<section class="card stack"><h2>${esc(g.g)}</h2><div class="stack" style="gap:10px">${g.items.map(([t, u, n]) => `<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>${n ? `<div class="small muted">${esc(n)}</div>` : ''}</div>`).join('')}</div></section>`).join('')}
    <p class="small muted">공개된 강의 · 자료는 링크로만 연결합니다. 사이트의 문제와 설명은 직접 만든 것입니다.</p>${footHTML()}</div>`;
}

/* ----- plan ----- */
function viewPlan() {
  const weeks = {};
  S.schedule.forEach(e => { (weeks[e.week] = weeks[e.week] || []).push(e); });
  const cal = Object.entries(weeks).map(([w, es]) => {
    const cells = [1, 2, 3, 4, 5, 6, 0].map(wd => es.find(e => e.wd === wd));
    return `<div class="week-label">${w}${T(' · week', '주차')}</div>` + cells.map(e => {
      if (!e) return '<div class="cell out"></div>';
      const cls = ['cell', e.type, e.day && modDone(e.day) ? 'done' : '', e.date === S.today ? 'today' : ''].join(' ');
      const label = e.type === 'normal' ? `${e.n}${T('', '일차')}` : e.type === 'light' ? T('light', '가벼운') : '';
      return e.day ? `<a class="${cls}" href="#${e.day}"><span class="d">${md(e.date)}</span><span class="muted">${label}</span></a>` : `<div class="${cls}"><span class="d">${md(e.date)}</span><span class="muted">${label}</span></div>`;
    }).join('');
  }).join('');
  const logs = Object.values(S.logs).sort((a, b) => a.date < b.date ? 1 : -1);
  const fixes = Object.values(S.fixes || {}).sort((a, b) => a.at < b.at ? 1 : -1);
  const fixOpen = fixes.filter(x => x.status !== 'done').length;
  const fixCard = `<section class="card stack"><h2>${T('Issue reports', '수정 요청')}</h2>
      <p class="small muted">${T('Use the Report button on any item.', '문제 · 단어 카드의 "수정 요청" 버튼으로 남긴 내용입니다. 다음 Claude 세션에서 반영하고 "반영됨"으로 바꿉니다.')} ${T('Open', '대기')} <b>${fixOpen}</b></p>
      ${fixes.length ? `<div class="tbl-wrap"><table><tr><th>${T('Date', '날짜')}</th><th>${T('Item', '대상')}</th><th>${T('Request', '내용')}</th><th>${T('Status', '상태')}</th></tr>${fixes.map(x => `<tr><td class="num">${md(x.date)}</td><td>${esc(x.qid || '#' + x.where)}</td><td>${esc(x.note)}${x.reply ? `<div class="small muted">↳ ${esc(x.reply)}</div>` : ''}</td><td>${x.status === 'done' ? T('Done', '반영됨') : T('Open', '대기')}</td></tr>`).join('')}</table></div>` : ''}
    </section>`;
  const f = v => v && v[1] ? `${v[0]}/${v[1]}` : '';
  view().innerHTML = `<div class="stack">
    <section class="card stack"><div class="row" style="justify-content:space-between"><h2>${T('Schedule', '학습 일정')}</h2>${S.diag && S.diag.result ? `<a class="btn sm" href="#diag">${T('Placement result', '진단 결과')}</a>` : ''}</div>
      <p class="small muted">${T('Weekdays only. Light days: review only.', '평일만 진도를 나갑니다. 노란 칸은 가벼운 학습일(여행 12/18~12/22 · 12/25 · 1/1), 회색 칸은 주말입니다. 시험일 2027-01-16(토).')}</p>
      <div class="tbl-wrap"><div class="cal" style="min-width:560px">${['월', '화', '수', '목', '금', '토', '일'].map((x, i) => `<div class="hd">${T(['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i], x)}</div>`).join('')}${cal}</div></div>
    </section>
    <section class="card stack"><h2>${T('Activity log', '학습 기록')}</h2>
      <div class="tbl-wrap"><table><tr><th>${T('Date', '날짜')}</th><th>${T('Type', '구분')}</th><th class="num">${T('Review', '복습')}</th><th class="num">${T('New', '새 단어')}</th><th class="num">${T('Form', '품사 변형')}</th><th class="num">Part 5</th><th class="num">LC</th><th>${T('Workbook', '교재 LC')}</th><th>${T('Notes', '메모')}</th></tr>
      ${logs.map(l => `<tr><td class="num">${md(l.date)}</td><td>${esc({normal: '정상', light: '가벼운', weekend: '주말'}[l.mode] || l.mode)}</td><td class="num">${f(l.review)}</td><td class="num">${l.newWords || ''}</td><td class="num">${f(l.drill)}</td><td class="num">${f(l.p5)}</td><td class="num">${f(l.lc)}</td><td>${(l.ext || []).map(x => `P${x.part} ${x.correct}/${x.total}`).join(' · ')}</td><td>${esc(l.memo || '')}</td></tr>`).join('') || `<tr><td colspan="9" class="muted">${T('No activity yet.', '아직 기록이 없습니다.')}</td></tr>`}</table></div>
    </section>${fixCard}${footHTML()}</div>`;
}

/* ---------- router ---------- */
async function render() {
  clearTimers(); S.kbd = null; S.busy = false;
  if (S.modal) S.closeModal();
  renderChrome();
  const r = route();
  const m = r.match(/^(d\d\d)(?:-(\w+))?$/);
  view().className = (m || r === 'home' || r === 'catalog') ? 'full' : 'wrap';
  if (m) await viewDay(m[1], m[2] && UNITS.some(u => u.k === m[2]) ? m[2] : null);
  else if (r === 'catalog') viewCatalog();
  else if (r === 'review') viewReview();
  else if (r === 'diag') await viewDiag();
  else if (r.startsWith('notes')) await viewNotes(r.split('-')[1]);
  else if (r === 'plan') viewPlan();
  else viewHome();
  if (!hasVoice()) document.body.classList.add('no-tts'); else document.body.classList.remove('no-tts');
  window.scrollTo(0, 0);
}
function passiveRefresh() {
  if (S.busy) return;
  const r = route();
  renderChrome();
  if (S.modal) return;
  if (r === 'home' || r === 'plan') { const y = window.scrollY; (r === 'home' ? viewHome : viewPlan)(); window.scrollTo(0, y); }
  else if (r === 'catalog') drawCatalog();
}
window.addEventListener('hashchange', render);
document.getElementById('skinBtn').addEventListener('click', () => setSkin(S.skin === 'work' ? 'focus' : 'work'));
function setSkin(s) {
  S.skin = s; try { localStorage.setItem('hub-skin', s); } catch (e) { /* ignore */ }
  if (S.busy) { renderChrome(); relabel(); } else render();
}
function relabel() { document.documentElement.dataset.skin = S.skin; }
document.addEventListener('keydown', e => {
  if (S.modal) { if (e.key === 'Escape') S.closeModal(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '');
  if (e.key === '`' && !typing) { e.preventDefault(); setSkin(S.skin === 'work' ? 'focus' : 'work'); return; }
  if (!typing && S.kbd && !e.metaKey && !e.ctrlKey && !e.altKey) S.kbd(e);
});
document.getElementById('stopBtn').addEventListener('click', () => {
  if (S.tts) S.tts.stop().catch(() => {});
  if (WS) { try { WS.cancel(); } catch (e) { /* ignore */ } document.getElementById('stopbar').hidden = true; }
});

/* ---------- boot ---------- */
(async () => {
  try { S.skin = localStorage.getItem('hub-skin') || 'work'; } catch (e) { S.skin = 'work'; }
  try { S.layout = localStorage.getItem('hub-layout') || 'auto'; } catch (e) { S.layout = 'auto'; }
  S.navOpen = effLayout() === 'full';
  applyLayout();
  document.getElementById('layBtn').addEventListener('click', () => {
    S.layout = {auto: 'full', full: 'compact', compact: 'auto'}[S.layout] || 'auto';
    try { localStorage.setItem('hub-layout', S.layout); } catch (e) { /* ignore */ }
    applyLayout(); S.navOpen = effLayout() === 'full';
    toast(T(`Layout: ${LAYOUT_LABEL[S.layout][0]}`, `화면 크기: ${LAYOUT_LABEL[S.layout][1]}${S.layout === 'auto' ? ' (기기에 맞춰 자동 전환)' : ''}`));
    if (!S.busy) render();
  });
  window.addEventListener('resize', () => { if (applyLayout() && !S.busy && route() !== 'catalog') render(); });
  document.getElementById('sync').addEventListener('click', openSync);
  document.documentElement.dataset.skin = S.skin;
  setInterval(() => { const t = ds(new Date()); if (t !== S.today) { S.today = t; passiveRefresh(); } }, 60000);
  await loadIndex();
  await Promise.all([loadDiag(), loadAllDays(), loadTsl()]);
  let booted = false;
  const ttsP = (async () => { try { return window.claude?.use ? await window.claude.use('tts') : null; } catch (e) { return null; } })();
  await Store.init(() => { if (booted) passiveRefresh(); });
  S.tts = await ttsP;
  if (S.tts) {
    S.tts.onState(({state}) => { document.getElementById('stopbar').hidden = state === 'idle'; });
  }
  booted = true;
  render();
})();
})();
</script>
